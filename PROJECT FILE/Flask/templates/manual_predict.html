<!DOCTYPE html>
<html>
<head>
    <title>Predict Temperature</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 450px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 25px;
            color: gray;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .result {
            margin-top: 20px;
            font-weight: bold;
            color: #0072ff;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Electric Motor Temperature</h2>
        <p>Enter sensor values to predict rotor temperature</p>

        <form action="/predict" method="POST">

            <input type="text" name="ambient" placeholder="Ambient Temperature" required>
            <input type="text" name="coolant" placeholder="Coolant Temperature" required>
            <input type="text" name="u_d" placeholder="Voltage d-component (u_d)" required>
            <input type="text" name="u_q" placeholder="Voltage q-component (u_q)" required>
            <input type="text" name="motor_speed" placeholder="Motor Speed" required>
            <input type="text" name="i_d" placeholder="Current d-component (i_d)" required>
            <input type="text" name="i_q" placeholder="Current q-component (i_q)" required>

            <button type="submit">Predict Temperature</button>
        </form>

        {% if prediction_text %}
            <div class="result">
                {{ prediction_text }}
            </div>
        {% endif %}
    </div>

</body>
</html>
