<!DOCTYPE html>
<html>
<head>
    <title>Electric Motor Temperature Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: white;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 25px;
        }

        .hero p {
            font-size: 20px;
            max-width: 750px;
            line-height: 1.6;
            margin-bottom: 50px;   /* This ensures spacing */
        }

        .btn {
            padding: 15px 45px;
            font-size: 18px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            color: white;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            transition: 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 32px;
            }

            .hero p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>Electric Motor Temperature Prediction</h1>

        <p>
            This machine learning application predicts the Permanent Magnet Surface
            (Rotor) temperature using real-time motor sensor data.
        </p>

        <a href="/predict" class="btn">Start Prediction</a>
    </div>

</body>
</html>
